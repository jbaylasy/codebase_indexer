[project]
name = "semantic-code-search"
version = "0.1.0"
description = "Semantic code search engine with MCP server and live file watching"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "lancedb>=0.21.0",
    "mcp[cli]>=1.27.2",
    "numpy>=2.4.6",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=5.5.1",
    "watchdog>=6.0.0",
    "python-dotenv>=1.0.0",
    "pyarrow>=18.0.0",
    "pylance>=7.0.0",
    "cryptography>=44.0.0",
    "pyyaml>=6.0.0",
    "uvicorn>=0.27.0",
    "tree-sitter>=0.24.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-rust>=0.23.0",
    "tree-sitter-go>=0.23.0",
    "tree-sitter-java>=0.23.0",
    "tree-sitter-c>=0.23.0",
    "tree-sitter-cpp>=0.23.0",
]

[project.scripts]
code-index = "code_index.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["code_index"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
